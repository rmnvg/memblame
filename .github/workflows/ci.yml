name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest ruff pytest-xdist pytest-cov pytest-randomly
      - run: ruff check src tests
      - run: python -m pytest -q
        env:
          PYTHONUTF8: "1"

  types:
    # memblame ships py.typed, so its annotations are part of the published contract.
    # One job only: some ignores are platform- or version-specific and `warn_unused_ignores`
    # would flag them on the other side of those branches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . mypy
      - run: mypy

  package:
    # Test the files users actually receive, including the test helpers in the sdist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine pytest pytest-xdist pytest-cov pytest-randomly
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          mkdir -p /tmp/memblame-sdist
          tar -xzf dist/memblame-*.tar.gz -C /tmp/memblame-sdist
          cd /tmp/memblame-sdist/memblame-*
          python -m pip install -e .
          python -m pytest -q
        env:
          PYTHONUTF8: "1"

  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode-ext
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: vscode-ext/*.vsix

  extension-integration:
    # Launches a real VS Code against a generated fixture repo: headless via xvfb on Linux,
    # directly on Windows (the only place the extension is exercised on Windows).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest  # the lens runs a pytest test in this interpreter
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm ci
        working-directory: vscode-ext
      - run: npm run compile
        working-directory: vscode-ext
      - name: Integration test (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node out/test/integration/runTest.js
        working-directory: vscode-ext
        env:
          MEMBLAME_TEST_PYTHON: python
      - name: Integration test (Windows)
        if: runner.os == 'Windows'
        run: node out/test/integration/runTest.js
        working-directory: vscode-ext
        env:
          MEMBLAME_TEST_PYTHON: python

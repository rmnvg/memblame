[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memblame"
description = "git blame for memory: find the commit and function that made your Python code use more memory"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []
dynamic = ["version"]
keywords = ["memory", "profiling", "tracemalloc", "regression", "git", "bisect", "pytest"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Reading memblame.toml / [tool.memblame] needs a TOML parser, which the standard library
# only has from 3.11 (tomllib). The core stays dependency-free.
toml = ["tomli>=1.1.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/rmnvg/memblame"
Issues = "https://github.com/rmnvg/memblame/issues"

[project.scripts]
memblame = "memblame.cli:main"

[tool.setuptools.dynamic]
version = {attr = "memblame.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memblame = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/memblame"]
# The package ships py.typed, so its annotations are part of what users get. Not strict:
# results are JSON-shaped dicts by design, and pinning python_version would flip the
# version-dependent branches (importlib.metadata, Windows-only constants) to the other side.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# The optional 3.9/3.10 TOML fallback; absent on 3.11+, where tomllib is used instead.
module = ["tomli"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

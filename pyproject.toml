[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memblame"
version = "0.1.0"
description = "git blame for memory: find the commit and function that made your Python code use more memory"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []
keywords = ["memory", "profiling", "tracemalloc", "regression", "git", "bisect", "pytest"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/rmnvg/memblame"
Issues = "https://github.com/rmnvg/memblame/issues"

[project.scripts]
memblame = "memblame.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
